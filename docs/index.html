<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Admin Catálogo — Mercado Limpio</title>
<meta name="description" content="Panel de administración de precios del catálogo Mercado Limpio." />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Admin Catálogo" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --primary:#0A84FF; --primary-dark:#0066CC; --primary-dim:rgba(10,132,255,.14);
  --accent:#FF9F0A; --accent-ink:#3A2100;
  --bg-body:#F2F2F7; --bg-nav:rgba(242,242,247,.78); --bg-card:rgba(255,255,255,.72); --bg-input:rgba(118,118,128,.12); --bg-elev:rgba(118,118,128,.16);
  --text-main:#1C1C1E; --text-muted:#8E8E93;
  --border:rgba(60,60,67,.13); --border-2:rgba(60,60,67,.20);
  --danger:#FF3B30; --danger-dim:rgba(255,59,48,.14);
  --radius:22px; --radius-s:14px; --radius-pill:999px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --blur:blur(20px) saturate(180%);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#409CFF; --primary-dark:#0A84FF; --primary-dim:rgba(64,156,255,.18);
    --accent:#FFB13D; --accent-ink:#2A1800;
    --bg-body:#000000; --bg-nav:rgba(0,0,0,.72); --bg-card:rgba(28,28,30,.72); --bg-input:rgba(118,118,128,.24); --bg-elev:rgba(118,118,128,.32);
    --text-main:#F2F2F7; --text-muted:#98989D;
    --border:rgba(84,84,88,.4); --border-2:rgba(84,84,88,.55);
    --danger:#FF453A; --danger-dim:rgba(255,69,58,.18);
    --shadow:0 10px 34px rgba(0,0,0,.55);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg-body); color:var(--text-main);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",'Inter',system-ui,sans-serif;
  min-height:100vh; padding-bottom:calc(40px + var(--safe-b));
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{font-family:inherit}

/* ── HEADER ── */
header{
  background:var(--bg-nav); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border-bottom:0.5px solid var(--border);
  padding:calc(10px + var(--safe-t)) 16px 12px; position:sticky; top:0; z-index:50;
}
.h-top{display:flex; align-items:flex-end; gap:10px; margin-bottom:14px}
.h-titlewrap{min-width:0; flex:1}
.h-eyebrow{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800; letter-spacing:.05em; color:var(--primary); text-transform:uppercase; margin-bottom:2px}
.h-eyebrow img{width:16px; height:16px; border-radius:5px}
.h-title-big{font-size:29px; font-weight:800; letter-spacing:-.02em; color:var(--text-main); line-height:1.1}
.h-count{flex-shrink:0; font-size:12px; color:var(--text-muted); font-weight:700; background:var(--bg-input); padding:5px 11px; border-radius:var(--radius-pill); white-space:nowrap}

/* ── Tabs de sección (Precios / Reglas) — estilo segmented control ── */
.section-tabs{display:flex; gap:2px; background:var(--bg-input); border-radius:var(--radius-pill); padding:3px}
.section-tab{
  flex:1; padding:9px 8px; border:none; background:transparent; color:var(--text-muted);
  font-weight:700; font-size:12.5px; cursor:pointer; border-radius:var(--radius-pill); transition:background .15s,color .15s;
}
.section-tab.active{color:var(--text-main); background:var(--bg-card); box-shadow:0 1px 6px rgba(0,0,0,.12)}

.h-search{position:relative; margin:12px 0 10px}
.h-search input{
  width:100%; padding:11px 14px 11px 36px; border-radius:var(--radius-pill); border:none;
  background:var(--bg-input); color:var(--text-main); font-size:15px; outline:none;
}
.h-search input:focus{box-shadow:0 0 0 3px var(--primary-dim)}
.h-search::before{content:"🔍"; position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:13px; opacity:.55}
.h-chips{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding-bottom:12px}
.h-chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0; padding:8px 14px; border-radius:var(--radius-pill); border:none;
  background:var(--bg-input); color:var(--text-muted); font-size:12.5px; font-weight:700; cursor:pointer;
  white-space:nowrap; min-height:34px;
}
.chip.active{background:var(--primary); color:#fff}
.chip .n{font-family:'Roboto Mono',monospace; font-size:10px; opacity:.75; margin-left:3px}

/* ── Caja de regla activa ── */
.regla-box{
  margin:0 16px 12px; padding:12px 14px; border-radius:var(--radius-s);
  background:var(--primary-dim); font-size:12.5px; color:var(--text-main);
  display:none;
}
.regla-box.show{display:block}
.regla-box b{color:var(--primary-dark)}
.regla-box .falta{color:var(--danger); font-weight:800}

/* ── Modo actualizar por lista ── */
.modo-toggle{
  margin:0 16px 12px; display:flex; border-radius:var(--radius-pill); overflow:hidden; background:var(--bg-input); padding:3px; gap:2px;
}
.modo-toggle button{
  flex:1; padding:10px 4px; border:none; background:transparent; color:var(--text-muted); font-weight:700; font-size:11.5px; cursor:pointer; border-radius:var(--radius-pill);
}
.modo-toggle button.active{background:var(--bg-card); color:var(--text-main); box-shadow:0 1px 6px rgba(0,0,0,.12)}
.modo-toggle button:disabled{opacity:.4; cursor:not-allowed}

/* ── Panel de importación masiva ── */
.import-panel{margin:0 16px 14px; background:var(--bg-card); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:0.5px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.import-step{margin-bottom:14px}
.import-step-title{font-size:11.5px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px}
.import-tabs{display:flex; gap:2px; margin-bottom:10px; background:var(--bg-input); border-radius:var(--radius-pill); padding:3px}
.import-tabs button{
  flex:1; padding:9px; border-radius:var(--radius-pill); border:none; background:transparent;
  color:var(--text-muted); font-weight:700; font-size:12px; cursor:pointer;
}
.import-tabs button.active{background:var(--bg-card); color:var(--text-main); box-shadow:0 1px 6px rgba(0,0,0,.12)}
.import-file{
  display:block; width:100%; padding:18px; border:1.5px dashed var(--border-2); border-radius:var(--radius-s);
  text-align:center; color:var(--text-muted); font-size:12.5px; cursor:pointer; background:var(--bg-input);
}
.import-file input{display:none}
.import-textarea{
  width:100%; min-height:110px; padding:10px; border-radius:var(--radius-s); border:none;
  background:var(--bg-input); color:var(--text-main); font-size:12px; font-family:'Roboto Mono',monospace; outline:none; resize:vertical;
}
.import-textarea:focus{box-shadow:0 0 0 3px var(--primary-dim)}
.import-hint{font-size:11px; color:var(--text-muted); margin-top:6px; line-height:1.5}
.import-row2{display:flex; gap:8px}
.import-row2 > div{flex:1}
.import-field label{font-size:10px; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px}
.import-field select{
  width:100%; padding:9px; border-radius:var(--radius-s); border:none; background:var(--bg-input);
  color:var(--text-main); font-size:12.5px; outline:none;
}
.import-btn{
  width:100%; padding:13px; border:none; border-radius:var(--radius-pill); background:var(--primary);
  color:#fff; font-weight:800; font-size:13.5px; cursor:pointer; margin-top:4px;
}
.import-btn:disabled{opacity:.4; cursor:default}
.import-btn.secundario{background:var(--bg-elev); color:var(--text-main)}
.import-preview-tabla{width:100%; border-collapse:collapse; font-size:11px}
.import-preview-tabla th{
  text-align:left; padding:6px 5px; color:var(--text-muted); font-size:9.5px; text-transform:uppercase;
  border-bottom:0.5px solid var(--border-2); position:sticky; top:0; background:var(--bg-card);
}
.import-preview-tabla td{padding:6px 5px; border-bottom:0.5px solid var(--border); vertical-align:top}
.import-preview-tabla .sin-match{color:var(--danger)}
.import-preview-tabla .flecha{color:var(--text-muted)}
.import-preview-tabla .nuevo{color:var(--primary-dark); font-weight:800}
.import-preview-wrap{max-height:340px; overflow-y:auto; border:0.5px solid var(--border); border-radius:var(--radius-s); margin-bottom:10px}
.import-resumen{font-size:12px; color:var(--text-muted); margin-bottom:10px}
.import-resumen b{color:var(--text-main)}
.import-o{font-size:11.5px; color:var(--text-muted); margin:14px 0 6px; font-weight:700}
.import-grupo{margin:0 0 14px}
.import-grupo-head{font-size:13px; margin-bottom:6px}
.import-grupo-nota{font-size:11px; color:var(--text-muted); margin-bottom:6px; line-height:1.4}

/* ── BULK PANEL ── */
.bulk{
  margin:0 16px 14px; background:var(--bg-card); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:0.5px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);
}
.bulk-title{font-size:12.5px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:10px}
.bulk-row{display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap}
.bulk-row select, .bulk-row input[type="number"]{
  padding:10px 12px; border-radius:var(--radius-s); border:none; background:var(--bg-input);
  color:var(--text-main); font-size:13.5px; outline:none;
}
.bulk-row select:focus, .bulk-row input:focus{box-shadow:0 0 0 3px var(--primary-dim)}
.bulk-tipo{display:flex; border-radius:var(--radius-pill); overflow:hidden; background:var(--bg-input); padding:3px; gap:2px}
.bulk-tipo button{
  padding:9px 14px; border:none; background:transparent; color:var(--text-muted); font-weight:700; font-size:13px; cursor:pointer; border-radius:var(--radius-pill);
}
.bulk-tipo button.active{background:var(--bg-card); color:var(--text-main); box-shadow:0 1px 6px rgba(0,0,0,.12)}
.bulk-target{font-size:12px; color:var(--text-muted); margin-bottom:10px}
.bulk-target b{color:var(--text-main)}
.bulk-apply{
  width:100%; padding:13px; border:none; border-radius:var(--radius-pill); background:var(--primary);
  color:#fff; font-weight:800; font-size:13.5px; cursor:pointer;
}
.bulk-apply:disabled{opacity:.4; cursor:default}
.bulk-progress{font-size:12px; color:var(--text-muted); margin-top:8px; text-align:center; display:none}
.bulk-progress.show{display:block}
.guardar-lista-bar{
  position:sticky; top:0; z-index:40; margin:0 16px 14px; display:none; gap:8px;
}
.guardar-lista-bar.show{display:flex}
.guardar-lista-bar button{
  flex:1; padding:13px; border:none; border-radius:var(--radius-pill); font-weight:800; font-size:13.5px; cursor:pointer;
}
.guardar-lista-bar .btn-guardar{background:var(--primary); color:#fff}
.guardar-lista-bar .btn-guardar:disabled{opacity:.4}
.guardar-lista-bar .btn-limpiar{background:var(--bg-elev); color:var(--text-main)}

/* ── LISTA ── */
.lista{padding:0 16px calc(16px + var(--safe-b)); display:flex; flex-direction:column; gap:9px}
.row{
  display:flex; gap:10px; align-items:center; background:var(--bg-card); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:0.5px solid var(--border); border-radius:var(--radius-s); padding:10px 11px; flex-wrap:wrap; box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.row input[type="checkbox"]{width:20px; height:20px; flex-shrink:0; accent-color:var(--primary)}
.row img{width:46px; height:46px; object-fit:contain; background:#fff; border-radius:10px; border:0.5px solid var(--border); flex-shrink:0}
.row-info{flex:1; min-width:0}
.row-name{font-size:12.5px; font-weight:700; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row-meta{font-size:10px; color:var(--text-muted); font-family:'Roboto Mono',monospace; margin-top:1px}
.row-meta .prov{color:var(--primary-dark); font-weight:700}
.row-price{display:flex; align-items:center; gap:4px; flex-shrink:0}
.row-price span{font-size:12px; color:var(--text-muted)}
.row-price input{
  width:88px; padding:8px; border-radius:10px; border:none; background:var(--bg-input);
  color:var(--text-main); font-size:13px; font-weight:700; text-align:right; outline:none; font-variant-numeric:tabular-nums;
}
.row-price input:focus{box-shadow:0 0 0 3px var(--primary-dim)}
.row-price input.saved{box-shadow:0 0 0 2px var(--primary)}
.row-price input.saving{opacity:.5}
.row-eventual{
  flex-shrink:0; width:30px; height:30px; border-radius:50%; border:none;
  background:var(--bg-input); color:var(--text-muted); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.row-eventual.on{background:var(--accent); color:#fff}

/* Fila en modo "actualizar por lista": input de precio nuevo + resultado calculado */
.row-lista-nueva{
  flex-basis:100%; display:flex; align-items:center; gap:8px; padding-top:8px; margin-top:6px;
  border-top:0.5px dashed var(--border-2);
}
.row-lista-nueva label{font-size:10.5px; color:var(--text-muted); font-weight:700; white-space:nowrap}
.row-lista-nueva input{
  width:100px; padding:7px 8px; border-radius:10px; border:none; background:var(--bg-input);
  color:var(--text-main); font-size:13px; font-weight:700; text-align:right; outline:none;
}
.row-lista-nueva input:focus{box-shadow:0 0 0 3px var(--primary-dim)}
.row-lista-nueva .resultado{
  flex:1; font-size:12.5px; font-weight:800; color:var(--text-muted); text-align:right;
}
.row-lista-nueva .resultado.listo{color:var(--primary-dark)}
.row-lista-nueva .resultado.pendiente-guardar{color:var(--accent)}
.row-lista-nueva .resultado.sospechoso{color:var(--danger)}

.empty{text-align:center; padding:60px 20px; color:var(--text-muted); font-size:13px}
.loading{text-align:center; padding:60px 20px; color:var(--text-muted); font-size:13px}

.toast{
  position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translateX(-50%);
  background:rgba(28,28,30,.85); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); color:#fff;
  padding:11px 20px; border-radius:var(--radius-pill); font-size:13px; font-weight:700; box-shadow:var(--shadow);
  z-index:400; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; text-align:center;
}
.toast.show{opacity:1}

/* ── VISTA REGLAS ── */
.reglas-lista{padding:14px 16px calc(14px + var(--safe-b)); display:flex; flex-direction:column; gap:10px}
.regla-card{
  background:var(--bg-card); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:0.5px solid var(--border); border-radius:var(--radius-s); padding:14px 15px; box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.regla-head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.regla-marca{font-weight:800; font-size:14px; flex:1}
.regla-estado{
  font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:var(--radius-pill); text-transform:uppercase; letter-spacing:.03em;
}
.regla-estado.Definida{background:rgba(48,209,88,.16); color:#248A3D}
.regla-estado.Falta.definir{background:var(--danger-dim); color:var(--danger)}
.regla-estado.Sistema.propio{background:rgba(255,159,10,.16); color:var(--accent)}
.regla-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px}
.regla-field{display:flex; flex-direction:column; gap:3px; min-width:0}
.regla-field label{font-size:9.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em}
.regla-field select, .regla-field input{
  width:100%; min-width:0; padding:8px 9px; border-radius:10px; border:none; background:var(--bg-input);
  color:var(--text-main); font-size:12.5px; outline:none;
}
.regla-field select:focus, .regla-field input:focus{box-shadow:0 0 0 3px var(--primary-dim)}
.regla-formula{
  font-size:11.5px; color:var(--text-muted); font-style:italic; background:var(--bg-elev); border-radius:10px;
  padding:8px 10px; margin-bottom:6px;
}
.regla-notas{width:100%; min-height:44px; resize:vertical; padding:8px 9px; border-radius:10px; border:none;
  background:var(--bg-input); color:var(--text-main); font-size:11.5px; outline:none;}
.regla-notas:focus{box-shadow:0 0 0 3px var(--primary-dim)}
.regla-count{font-size:10.5px; color:var(--text-muted); margin-top:6px}
</style>
</head>
<body>

<header>
  <div class="h-top">
    <div class="h-titlewrap">
      <div class="h-eyebrow"><img src="./icon-192.png" alt="" /> Mercado Limpio</div>
      <div class="h-title-big">Admin Catálogo</div>
    </div>
    <div class="h-count" id="count">— productos</div>
  </div>
  <div class="section-tabs">
    <button type="button" class="section-tab active" data-sec="precios">💲 Precios</button>
    <button type="button" class="section-tab" data-sec="reglas">📐 Reglas por proveedor</button>
  </div>
</header>

<!-- ══════════ SECCIÓN PRECIOS ══════════ -->
<div id="secPrecios">
  <div style="padding:0 16px">
    <div class="h-search"><input type="text" id="buscador" placeholder="Buscar producto..." autocomplete="off" /></div>
  </div>
  <div class="h-chips" id="marcas" style="padding-left:16px; padding-right:16px"></div>

  <div class="regla-box" id="reglaBox"></div>

  <div class="modo-toggle" id="modoToggle">
    <button type="button" id="modoPrecio" class="active">Editar precio</button>
    <button type="button" id="modoListaNueva">📋 Uno por uno</button>
    <button type="button" id="modoImportar">📤 Subir lista</button>
  </div>

  <div class="guardar-lista-bar" id="guardarListaBar">
    <button type="button" class="btn-limpiar" id="btnLimpiarLista">Limpiar</button>
    <button type="button" class="btn-guardar" id="btnGuardarLista" disabled>Guardar 0 precios nuevos</button>
  </div>

  <!-- ══ Panel: subir la lista de uno o varios proveedores ══ -->
  <div class="import-panel" id="importPanel" style="display:none">
    <div id="importOrigen">
      <label class="import-file" id="importFileLabel">
        📎 <b>Tocá para elegir la lista del proveedor</b> — PDF, Excel o texto<br>
        <small>No hace falta elegir la marca: se detecta sola. Si el proveedor manda dos listas (La Gauchita, Durax), elegí las dos juntas y queda el precio más barato.</small>
        <input type="file" id="importFile" accept=".xlsx,.xls,.pdf,.csv,.txt" multiple />
      </label>
      <div class="import-o">o pegá el mensaje del proveedor (WhatsApp, mail…):</div>
      <textarea class="import-textarea" id="importTexto" placeholder="Pegá acá el texto con los precios…"></textarea>
      <button type="button" class="import-btn" id="btnAnalizarTexto">Analizar texto →</button>
    </div>
    <div class="import-hint" id="importProgreso" style="display:none; text-align:center; padding:18px 0"></div>
    <div id="importPreview" style="display:none">
      <div class="import-resumen" id="importResumen"></div>
      <div id="importGrupos"></div>
      <button type="button" class="import-btn" id="btnImportAplicar">Aplicar</button>
      <button type="button" class="import-btn secundario" id="btnImportOtra" style="margin-top:8px">Subir otra lista</button>
    </div>
  </div>

  <div class="bulk" id="bulkPanel">
    <div class="bulk-title">Ajuste masivo de precio</div>
    <div class="bulk-target" id="bulkTarget">Se aplica a: <b>—</b></div>
    <div class="bulk-row">
      <div class="bulk-tipo">
        <button type="button" id="tipoPorc" class="active">%</button>
        <button type="button" id="tipoPesos">$ fijo</button>
      </div>
      <select id="bulkSigno">

</div>

<div id="secReglas" style="display:none">

</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL  = "https://gjeyvbidomxzofcdycya.supabase.co";
const SB_ANON = "sb_publishable_CjdA8GwtCljm_PzT8pqk3g_QIhTmUHT";

const $ = id => document.getElementById(id);
function escHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(n){ return n==null ? "" : Number(n).toLocaleString("es-AR",{maximumFractionDigits:2}); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove("show"),2600); }

// ── Datos ──
let CATALOGO = [];
let REGLAS = [];
let marcaActiva = "TODAS";
let busq = "";
let tipoAjuste = "porc"; // "porc" | "pesos"
let modoActual = "precio"; // "precio" | "lista"
const precionsNuevos = {}; // codigo -> valor tipeado (modo "lista nueva")

async function fetchTabla(nombre, orderBy){
  const acc = [];
  let desde = 0; const PAGE = 1000;
  while (true) {
    const res = await fetch(`${SB_URL}/rest/v1/${nombre}?select=*&order=${orderBy}`, {
      headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}`, Range: `${desde}-${desde+PAGE-1}` }
    });
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error(JSON.stringify(rows));
    acc.push(...rows);
    if (rows.length < PAGE) break;
    desde += PAGE;
  }
  return acc;
}

async function init(){
  try {
    [CATALOGO, REGLAS] = await Promise.all([
      fetchTabla("catalogo_visual_productos", "marca.asc,nombre.asc"),
      fetchTabla("reglas_precio_proveedor", "marca.asc").catch(() => []), // si la tabla no existe todavía, seguimos sin reglas
    ]);
  } catch (e) {
    $("lista").innerHTML = `<div class="empty">No se pudo cargar el catálogo.<br><small>${escHtml(e.message)}</small></div>`;
    return;
  }
  renderMarcas();
  renderLista();
  renderBulkTarget();
  renderReglaBox();
  renderReglasSeccion();
}

function reglaDe(marca){ return REGLAS.find(r => r.marca === marca) || null; }

function itemsFiltrados(){
  let items = marcaActiva === "TODAS" ? CATALOGO : CATALOGO.filter(p => p.marca === marcaActiva);
  if (busq) {
    const q = busq.toLowerCase();
    items = items.filter(p => p.nombre.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q) || String(p.codigo).toLowerCase().includes(q) || String(p.codigo_proveedor||"").toLowerCase().includes(q));
  }
  return items;
}

function renderMarcas(){
  const conteo = {};
  CATALOGO.forEach(p => { conteo[p.marca] = (conteo[p.marca]||0)+1; });
  const marcas = Object.keys(conteo).sort((a,b) => conteo[b]-conteo[a]);
  $("marcas").innerHTML =
    `<button type="button" class="chip ${marcaActiva==='TODAS'?'active':''}" data-m="TODAS">Todas <span class="n">${CATALOGO.length}</span></button>` +
    marcas.map(m => `<button type="button" class="chip ${m===marcaActiva?'active':''}" data-m="${escHtml(m)}">${escHtml(m)} <span class="n">${conteo[m]}</span></button>`).join("");
}
$("marcas").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  marcaActiva = b.dataset.m;
  Object.keys(precionsNuevos).forEach(k => delete precionsNuevos[k]);
  renderMarcas(); renderLista(); renderBulkTarget(); renderReglaBox(); actualizarBarraGuardar();
});
$("buscador").addEventListener("input", () => {
  busq = $("buscador").value.trim();
  renderLista(); renderBulkTarget();
});

// ── Caja de regla activa (muestra la fórmula de la marca elegida) ──
// "Subir lista" funciona siempre (la marca se detecta sola); solo "Uno por
// uno" necesita una marca elegida con regla.
function renderReglaBox(){
  const box = $("reglaBox");
  if (marcaActiva === "TODAS") {
    box.classList.remove("show"); $("modoListaNueva").disabled = true;
    if (modoActual === "lista") setModo("precio");
    return;
  }
  const r = reglaDe(marcaActiva);
  $("modoListaNueva").disabled = false;
  if (!r || r.estado === "Falta definir") {
    box.innerHTML = `<span class="falta">⚠️ ${escHtml(marcaActiva)} todavía no tiene una regla de precio definida.</span> Definila en la pestaña "Reglas por proveedor" antes de actualizar precios.`;
    box.classList.add("show");
    $("modoListaNueva").disabled = true;
    if (modoActual === "lista") setModo("precio");
    return;
  }
  if (r.estado === "Sistema propio") {
    box.innerHTML = `${escHtml(marcaActiva)} usa un sistema de precios propio, aparte de este panel.`;
    box.classList.add("show");
    $("modoListaNueva").disabled = true;
    if (modoActual === "lista") setModo("precio");
    return;
  }
  box.innerHTML = `<b>Regla de ${escHtml(marcaActiva)}:</b> ${escHtml(r.formula_texto || "—")}`;
  box.classList.add("show");
}

// ── Calcula el precio final a partir del "precio de lista" nuevo, según la regla de la marca ──
function calcularPrecioFinal(marca, precioListaNuevo, producto){
  const r = reglaDe(marca);
  if (!r || r.estado !== "Definida" || precioListaNuevo == null || isNaN(precioListaNuevo)) return null;
  let base = precioListaNuevo;
  if (r.iva_pct) base = base * (1 + Number(r.iva_pct)/100);
  // Precio de lista por BULTO (Bio Bag / Melli): se divide por las unidades
  // del bulto, que ya están cargadas en la presentación "Bulto" del producto
  // (1000, 500 o 300 bolsas — lo mismo que dice la lista: "100 paquetes x10").
  if (r.base_tipo === "BULTO_DIV_UNIDADES") {
    const bulto = producto && producto.venta && (producto.venta.pres || []).find(p => p.id === "bulto");
    if (!bulto || !(bulto.factor > 0)) return null;
    base = base / bulto.factor;
  }
  const mult = Number(r.multiplicador || 1);
  return Math.round(base * mult * 100) / 100;
}

// Un precio calculado es "sospechoso" cuando no tiene sentido por sí solo o
// cuando se dispara respecto al precio actual — casi siempre porque se
// matcheó la columna equivocada (un código/EAN en vez del precio) o el
// formato de número equivocado en el paso anterior. Nunca se aplica solo:
// se muestra aparte para que se revise a mano antes de tocar nada.
function precioSospechoso(nuevo, actual){
  if (nuevo == null || isNaN(nuevo) || nuevo < 20) return true; // lo más barato del catálogo ronda $57 — menos de $20 es un número mal leído
  if (nuevo > 500000) return true; // ningún producto del catálogo vale esto
  if (actual != null && actual > 0) {
    const ratio = nuevo / actual;
    if (ratio > 3 || ratio < 0.33) return true;
  }
  return false;
}

// ── Modo: editar precio directo / uno por uno / importar archivo ──
function setModo(m){
  modoActual = m;
  $("modoPrecio").classList.toggle("active", m === "precio");
  $("modoListaNueva").classList.toggle("active", m === "lista");
  $("modoImportar").classList.toggle("active", m === "importar");
  $("bulkPanel").style.display = m === "precio" ? "" : "none";
  $("lista").style.display = m === "importar" ? "none" : "";
  $("importPanel").style.display = m === "importar" ? "" : "none";
  if (m !== "lista") { $("guardarListaBar").classList.remove("show"); }
  actualizarBarraGuardar();
  if (m !== "importar") renderLista();
}
$("modoPrecio").onclick = () => setModo("precio");
$("modoListaNueva").onclick = () => setModo("lista");
$("modoImportar").onclick = () => { setModo("importar"); resetImportPanel(); };

function renderLista(){
  const items = itemsFiltrados();
  $("count").textContent = items.length + (items.length===1 ? " producto" : " productos");
  if (!items.length) { $("lista").innerHTML = `<div class="empty">Sin productos para este filtro.</div>`; return; }

  $("lista").innerHTML = items.map(p => {
    const filaLista = modoActual === "lista" ? `
      <div class="row-lista-nueva">
        <label>Precio de lista:</label>
        <input type="number" class="lista-nueva-input" step="0.01" min="0"
          value="${precionsNuevos[p.codigo] ?? ''}" placeholder="0.00" />
        <span class="resultado" data-codigo="${escHtml(p.codigo)}">—</span>
      </div>` : "";
    return `
    <div class="row" data-codigo="${escHtml(p.codigo)}">
      <input type="checkbox" class="row-check" />
      <img src="${escHtml(p.foto)}" loading="lazy" onerror="this.style.opacity=0.15" alt="" />
      <div class="row-info">
        <div class="row-name">${escHtml(p.nombre)}</div>
        <div class="row-meta">${escHtml(p.marca)} · #${escHtml(p.codigo)}${p.codigo_proveedor ? ` · <span class="prov">prov: ${escHtml(p.codigo_proveedor)}</span>` : ""}</div>
      </div>
      <button type="button" class="row-eventual ${p.eventual ? 'on' : ''}" title="Stock eventual">⚠️</button>
      <div class="row-price">
        <span>$</span>
        <input type="number" class="price-input" value="${p.mayorista != null ? p.mayorista : ''}" placeholder="—" step="0.01" min="0" />
      </div>
      ${filaLista}
    </div>`;
  }).join("");

  if (modoActual === "lista") items.forEach(p => actualizarResultadoFila(p.codigo));
}

function actualizarResultadoFila(codigo){
  const row = document.querySelector(`.row[data-codigo="${CSS.escape(codigo)}"]`);
  if (!row) return;
  const span = row.querySelector(".resultado");
  if (!span) return;
  const val = precionsNuevos[codigo];
  if (val == null || val === "") { span.textContent = "—"; span.className = "resultado"; return; }
  const p = CATALOGO.find(x => x.codigo === codigo);
  const final = calcularPrecioFinal(p.marca, Number(val), p);
  if (final == null) {
    span.textContent = "no se puede calcular solo (ver nota de la regla)";
    span.className = "resultado";
  } else if (precioSospechoso(final, p.mayorista)) {
    span.textContent = `⚠️ $${fmt(final)} — no parece bien, revisar`;
    span.className = "resultado sospechoso";
  } else {
    span.textContent = `→ $${fmt(final)}`;
    span.className = "resultado pendiente-guardar";
  }
}

$("lista").addEventListener("input", (e) => {
  if (!e.target.classList.contains("lista-nueva-input")) return;
  const row = e.target.closest(".row");
  const codigo = row.dataset.codigo;
  const val = e.target.value;
  if (val === "") delete precionsNuevos[codigo]; else precionsNuevos[codigo] = val;
  actualizarResultadoFila(codigo);
  actualizarBarraGuardar();
});

function actualizarBarraGuardar(){
  const n = Object.keys(precionsNuevos).length;
  const bar = $("guardarListaBar");
  bar.classList.toggle("show", modoActual === "lista" && n > 0);
  $("btnGuardarLista").disabled = n === 0;
  $("btnGuardarLista").textContent = `Guardar ${n} precio${n===1?'':'s'} nuevo${n===1?'':'s'}`;
}

$("btnLimpiarLista").onclick = () => {
  Object.keys(precionsNuevos).forEach(k => delete precionsNuevos[k]);
  renderLista(); actualizarBarraGuardar();
};

$("btnGuardarLista").onclick = async () => {
  const entradas = Object.entries(precionsNuevos);
  const calculados = entradas.map(([codigo, val]) => {
    const p = CATALOGO.find(x => x.codigo === codigo);
    const final = calcularPrecioFinal(p.marca, Number(val), p);
    return { codigo, final, p };
  }).filter(x => x.final != null);
  const aplicables = calculados.filter(x => !precioSospechoso(x.final, x.p.mayorista));
  const sospechosos = calculados.length - aplicables.length;

  if (!aplicables.length) { toast(sospechosos ? "Todos dieron un precio raro — revisalos, no se guardó nada." : "Ninguno se puede calcular automático con esta regla."); return; }
  if (!confirm(`Vas a actualizar el precio final de ${aplicables.length} producto${aplicables.length===1?'':'s'} de ${escHtml(marcaActiva)}.${sospechosos ? ` (${sospechosos} con precio raro se van a saltear.)` : ''} ¿Confirmás?`)) return;

  $("btnGuardarLista").disabled = true;
  let ok = 0, fail = 0;
  for (const { codigo, final, p } of aplicables) {
    try {
      const res = await fetch(`${SB_URL}/rest/v1/catalogo_visual_productos?codigo=eq.${encodeURIComponent(codigo)}`, {
        method: "PATCH",
        headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}`, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify({ mayorista: final }),
      });
      if (!res.ok) throw new Error();
      p.mayorista = final;
      ok++;
    } catch (e) { fail++; }
  }
  Object.keys(precionsNuevos).forEach(k => delete precionsNuevos[k]);
  actualizarBarraGuardar();
  setModo("precio");
  toast(`✔ ${ok} precio${ok===1?'':'s'} actualizado${ok===1?'':'s'}${fail?`, ${fail} con error`:''}${sospechosos?`, ${sospechosos} salteado${sospechosos===1?'':'s'} por raro`:''}`);
};

// Editar precio individual (modo normal): guarda al salir del campo o con Enter.
$("lista").addEventListener("focusout", async (e) => {
  const input = e.target.closest(".price-input");
  if (!input) return;
  const row = input.closest(".row");
  const codigo = row.dataset.codigo;
  const p = CATALOGO.find(x => x.codigo === codigo);
  const val = input.value === "" ? null : Number(input.value);
  if (val === p.mayorista) return;
  await guardarPrecio(codigo, val, input);
});
$("lista").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.classList.contains("price-input")) e.target.blur();
});
$("lista").addEventListener("click", async (e) => {
  const btn = e.target.closest(".row-eventual");
  if (!btn) return;
  const row = btn.closest(".row");
  const codigo = row.dataset.codigo;
  const p = CATALOGO.find(x => x.codigo === codigo);
  const nuevo = !p.eventual;
  btn.classList.toggle("on", nuevo);
  p.eventual = nuevo;
  await fetch(`${SB_URL}/rest/v1/catalogo_visual_productos?codigo=eq.${encodeURIComponent(codigo)}`, {
    method: "PATCH",
    headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}`, "Content-Type": "application/json", Prefer: "return=minimal" },
    body: JSON.stringify({ eventual: nuevo })
  });
  toast(nuevo ? "Marcado como stock eventual" : "Sacado de stock eventual");
});

async function guardarPrecio(codigo, val, inputEl){
  inputEl.classList.add("saving");
  try {
    const res = await fetch(`${SB_URL}/rest/v1/catalogo_visual_productos?codigo=eq.${encodeURIComponent(codigo)}`, {
      method: "PATCH",
      headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}`, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ mayorista: val })
    });
    if (!res.ok) throw new Error(await res.text());
    const p = CATALOGO.find(x => x.codigo === codigo);
    p.mayorista = val;
    inputEl.classList.remove("saving");
    inputEl.classList.add("saved");
    setTimeout(() => inputEl.classList.remove("saved"), 900);
  } catch (e) {
    inputEl.classList.remove("saving");
    toast("Error al guardar: " + e.message);
  }
}

// ── Ajuste masivo ──
$("tipoPorc").onclick = () => { tipoAjuste = "porc"; $("tipoPorc").classList.add("active"); $("tipoPesos").classList.remove("active"); };
$("tipoPesos").onclick = () => { tipoAjuste = "pesos"; $("tipoPesos").classList.add("active"); $("tipoPorc").classList.remove("active"); };

function renderBulkTarget(){
  const seleccionados = [...document.querySelectorAll(".row-check:checked")].length;
  let texto;
  if (seleccionados > 0) texto = `${seleccionados} producto${seleccionados===1?'':'s'} seleccionado${seleccionados===1?'':'s'}`;
  else if (busq) texto = `los ${itemsFiltrados().length} resultados de "${escHtml(busq)}"`;
  else if (marcaActiva !== "TODAS") texto = `toda la marca <b>${escHtml(marcaActiva)}</b> (${itemsFiltrados().length})`;
  else texto = `TODO el catálogo (${CATALOGO.length}) — elegí una marca o filtrá antes de aplicar`;
  $("bulkTarget").innerHTML = "Se aplica a: <b>" + texto + "</b>";
}
$("lista").addEventListener("change", e => { if (e.target.classList.contains("row-check")) renderBulkTarget(); });

$("bulkApply").onclick = async () => {
  const valor = Number($("bulkValor").value);
  if (!valor || valor <= 0) { toast("Poné un valor mayor a 0"); return; }
  const signo = Number($("bulkSigno").value);

  const seleccionados = [...document.querySelectorAll(".row-check:checked")].map(c => c.closest(".row").dataset.codigo);
  let objetivo;
  if (seleccionados.length) objetivo = CATALOGO.filter(p => seleccionados.includes(p.codigo));
  else objetivo = itemsFiltrados();

  if (!objetivo.length) { toast("No hay productos para ajustar"); return; }
  if (!seleccionados.length && marcaActiva === "TODAS" && !busq) {
    if (!confirm(`Vas a tocar el precio de los ${objetivo.length} productos del catálogo completo. ¿Seguro?`)) return;
  } else if (!confirm(`Se va a ${signo>0?'aumentar':'bajar'} el precio de ${objetivo.length} producto(s). ¿Confirmás?`)) {
    return;
  }

  const conPrecio = objetivo.filter(p => p.mayorista != null);
  if (conPrecio.length < objetivo.length) toast(`${objetivo.length - conPrecio.length} sin precio cargado, se saltean`);

  $("bulkApply").disabled = true;
  const prog = $("bulkProgress"); prog.classList.add("show");
  let hechos = 0, fallidos = 0;
  const CHUNK = 12;
  for (let i = 0; i < conPrecio.length; i += CHUNK) {
    const tanda = conPrecio.slice(i, i + CHUNK);
    await Promise.all(tanda.map(async p => {
      const nuevo = tipoAjuste === "porc"
        ? p.mayorista * (1 + signo * valor / 100)
        : p.mayorista + signo * valor;
      const final = Math.max(0, Math.round(nuevo * 100) / 100);
      try {
        const res = await fetch(`${SB_URL}/rest/v1/catalogo_visual_productos?codigo=eq.${encodeURIComponent(p.codigo)}`, {
          method: "PATCH",
          headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}`, "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify({ mayorista: final })
        });
        if (!res.ok) throw new Error();
        p.mayorista = final;
        hechos++;
      } catch (e) { fallidos++; }
    }));
    prog.textContent = `Aplicando… ${Math.min(i + CHUNK, conPrecio.length)} / ${conPrecio.length}`;
  }
  $("bulkApply").disabled = false;
  prog.textContent = `Listo: ${hechos} actualizados${fallidos ? `, ${fallidos} con error` : ""}.`;
  setTimeout(() => prog.classList.remove("show"), 3000);
  document.querySelectorAll(".row-check:checked").forEach(c => c.checked = false);
  renderBulkTarget();
  renderLista();
  toast(`✔ ${hechos} precio${hechos===1?'':'s'} actualizado${hechos===1?'':'s'}`);
};

// ══════════════════ SUBIR LISTAS DE PROVEEDORES ══════════════════
// Regla de oro: Pablo sube la lista (PDF, Excel o el mensaje de WhatsApp
// pegado) y el sistema resuelve TODO solo — de qué proveedor es, qué
// renglón es cada artículo, qué número es el precio — y deja un solo toque
// para aplicar. Nada de elegir marca ni columnas.
//
// Cómo reconoce cada artículo, en orden de confianza:
//  1. Por código del proveedor (codigo_proveedor ya guardado): se busca la
//     columna que coincide con más códigos distintos, y la columna de
//     precio + formato de número que da precios creíbles y más parecidos a
//     los actuales.
//  2. Por código de barras (nuestro código interno es el EAN en muchas
//     marcas): si aparece en un renglón, ese es el renglón.
//  3. Por nombre (solo marcas casi sin códigos cargados, p.ej. Fedata por
//     WhatsApp): medidas obligatorias, palabras con abreviaturas.
// Protecciones: un precio absurdo nunca se aplica (precioSospechoso), y una
// lista de un proveedor no puede tocar artículos de otro (ver aceptable()).
// Si un artículo viene en varias listas a la vez (La Gauchita, Durax), queda
// el precio más barato.

const importState = { fuentes: [], resultado: null };

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function resetImportPanel(){
  importState.fuentes = []; importState.resultado = null; importState.forzar = {};
  $("importOrigen").style.display = "";
  $("importProgreso").style.display = "none";
  $("importPreview").style.display = "none";
  $("importFile").value = "";
  $("importTexto").value = "";
}

// ── Lectura de archivos ──
// Extrae el texto de un PDF reconstruyendo renglones por posición (Y).
async function extraerTextoPdf(buf, posiciones){
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const lineas = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const spans = content.items
      .map(it => ({ text: it.str, x: it.transform[4], y: it.transform[5] }))
      .filter(s => s.text.trim());
    if (posiciones) spans.forEach(s => posiciones.push({ p, x: s.x, y: s.y, s: s.text.trim() })); // para catálogos en grilla (MisPlast)
    spans.sort((a, b) => b.y - a.y || a.x - b.x); // en pdf.js el Y crece hacia arriba
    const filas = []; const TOL = 3;
    for (const s of spans) {
      let f = filas.find(f => Math.abs(f.y - s.y) <= TOL);
      if (!f) { f = { y: s.y, items: [] }; filas.push(f); }
      f.items.push(s);
    }
    filas.sort((a, b) => b.y - a.y);
    filas.forEach(f => {
      f.items.sort((a, b) => a.x - b.x);
      lineas.push(f.items.map(i => i.text).join(" ").replace(/\s+/g, " ").trim()); // pdf.js deja espacios de más dentro de los textos
    });
  }
  return lineas.join("\n");
}

function fuenteDeTexto(nombre, texto){
  const lineas = texto.split("\n");
  return { nombre, lineas, filas: lineas.map(parseLineaTexto).filter(f => f.length) };
}

async function leerArchivo(file){
  const nombre = file.name.toLowerCase();
  if (nombre.endsWith(".pdf")) {
    const items = [];
    const f = fuenteDeTexto(file.name, await extraerTextoPdf(await file.arrayBuffer(), items));
    f.items = items;
    return f;
  }
  if (nombre.endsWith(".txt")) return fuenteDeTexto(file.name, await file.text());
  // Excel y CSV: SheetJS separa las columnas bien (comillas, comas en campos…).
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
  const filas = [];
  wb.SheetNames.forEach(n => filas.push(...XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true })));
  const lineas = filas.map(f => (f || []).map(v => v == null ? "" : String(v)).join("  "));
  return { nombre: file.name, lineas, filas: filas.filter(f => f && f.length) };
}

// Parte un renglón de texto (pegado o de un PDF) en celdas. Las comas NO se
// usan como separador en general: en las listas casi siempre son parte de
// un número ("1,119.90" o "1.234,50"). Solo se toma como "código,precio" un
// renglón de exactamente dos campos sin espacios, si lo de después de la
// coma no son 1-2 dígitos (eso sería un decimal: "1234,50").
function parseLineaTexto(linea){
  const l = String(linea || "").trim();
  if (!l) return [];
  let celdas;
  const dosCampos = l.match(/^([^,\s]+)\s*,\s*([^,\s]+)$/);
  if (l.includes("\t")) celdas = l.split("\t");
  else if (dosCampos && !/^\d{1,2}$/.test(dosCampos[2])) celdas = [dosCampos[1], dosCampos[2]];
  else if (/\s{2,}/.test(l)) celdas = l.split(/\s{2,}/);
  else celdas = l.split(/\s+/);
  return celdas.map(s => s.trim()).filter(s => /[A-Za-z0-9]/.test(s)); // descarta sueltos tipo "*" o "$"
}

// Índice de columna positivo (desde el inicio, Excel) o negativo (desde el
// final, texto/PDF: el nombre cambia de largo pero el precio siempre queda
// en la misma posición contando desde la derecha).
function resolverIdx(idx, len){ return idx < 0 ? len + idx : idx; }

function parseNumero(str, formato){
  if (typeof str === "number") return str; // celda numérica de Excel: ya es el número
  let s = String(str).trim().replace(/[^\d.,\-]/g, "");
  if (!s) return NaN;
  if (formato === "auto") {
    // Por la forma de cada número (en un mismo catálogo conviven "1.325,00"
    // y "860.00"): tras el último separador, 3 dígitos = miles; si no, decimales.
    s = s.replace(/[.,]+$/, "");
    const i = Math.max(s.lastIndexOf("."), s.lastIndexOf(","));
    if (i < 0) return parseFloat(s);
    const dec = s.slice(i + 1);
    if (dec.length === 3) return parseFloat(s.replace(/[.,]/g, ""));
    return parseFloat(s.slice(0, i).replace(/[.,]/g, "") + "." + dec);
  }
  if (formato === "punto") return parseFloat(s.replace(/,/g, ""));
  if (formato === "coma") return parseFloat(s.replace(/\./g, "").replace(",", "."));
  if (formato === "miles_coma_decimal_punto") return parseFloat(s.replace(/,/g, ""));
  if (formato === "miles_punto_decimal_coma") return parseFloat(s.replace(/\./g, "").replace(",", "."));
  return parseFloat(s);
}
const FORMATOS = ["auto", "miles_punto_decimal_coma", "punto", "coma", "miles_coma_decimal_punto"];

// Qué tan lejos quedan (en la mediana) los precios nuevos de los actuales:
// 0 = iguales, 0.2 ≈ un 20% de diferencia. Sin datos, infinito.
function desvioMediano(ratios){
  if (!ratios.length) return Infinity;
  const d = ratios.map(r => Math.abs(Math.log(r))).sort((a, b) => a - b);
  return d[Math.floor(d.length / 2)];
}

// ── 1. Por código del proveedor ──
function detectarPorCodigo(marca, prods, filas){
  const conCod = prods.filter(p => p.codigo_proveedor);
  const filasValidas = filas.filter(f => f && f.length);
  if (conCod.length < 2 || !filasValidas.length) return null;
  // código → productos (puede haber más de uno: el mismo artículo del
  // proveedor con dos códigos de barras distintos, p.ej. Make 6805).
  const porCodigo = new Map();
  conCod.forEach(p => { const k = String(p.codigo_proveedor).trim(); porCodigo.set(k, [...(porCodigo.get(k) || []), p]); });
  const maxCols = Math.max(...filasValidas.slice(0, 80).map(f => f.length));
  const candidatos = [];
  for (let c = 0; c < Math.min(maxCols, 10); c++) candidatos.push(c);
  for (let k = 1; k <= Math.min(6, maxCols); k++) candidatos.push(-k);

  // Columna de código: la que coincide con MÁS CÓDIGOS DISTINTOS (no
  // renglones: una columna de cantidades "12", "24" coincide mil veces con
  // códigos chicos como el 12, pero siempre con los mismos 4 o 5 valores).
  let colCod = null, mejorDistintos = 0;
  for (const cand of candidatos) {
    const vistos = new Set();
    for (const f of filasValidas) {
      const i = resolverIdx(cand, f.length);
      if (i < 0 || i >= f.length) continue;
      const v = String(f[i] ?? "").trim();
      if (porCodigo.has(v)) vistos.add(v);
    }
    if (vistos.size > mejorDistintos) { mejorDistintos = vistos.size; colCod = cand; }
  }
  if (colCod == null || mejorDistintos < 2) return null;

  // Columna de precio + formato: la que da más precios creíbles; si empatan
  // (típico: "sin IVA" y "con IVA"), la que queda más cerca de los actuales.
  const evaluar = (colPre, formato) => {
    const vistos = new Set(); const matched = [];
    for (const f of filasValidas) {
      const iC = resolverIdx(colCod, f.length), iP = resolverIdx(colPre, f.length);
      if (iC < 0 || iP < 0 || iC >= f.length || iP >= f.length) continue;
      const cod = String(f[iC] ?? "").trim();
      const productos = porCodigo.get(cod);
      if (!productos || vistos.has(cod)) continue;
      const precio = parseNumero(f[iP], formato);
      if (isNaN(precio)) continue;
      vistos.add(cod);
      for (const producto of productos) {
        matched.push({ producto, precioListaRaw: precio, nuevoPrecio: calcularPrecioFinal(marca, precio, producto), via: "código " + cod });
      }
    }
    return matched;
  };
  let mejor = null;
  for (const cand of candidatos) {
    if (cand === colCod) continue;
    for (const formato of FORMATOS) {
      const matched = evaluar(cand, formato);
      if (matched.length < 2) continue;
      const st = estadisticas(matched);
      if (!mejor || st.ok > mejor.st.ok || (st.ok === mejor.st.ok && st.desvio < mejor.st.desvio)) mejor = { matched, st };
    }
  }
  return mejor ? { matched: mejor.matched, metodo: "código" } : null;
}

// ── 2 y 3. Por renglón: código de barras o nombre ──
const PALABRAS_VACIAS = new Set(["de","del","la","el","los","las","con","para","y","x","cm","mm","mts","mt","un","und","unid","gr","grs","g","kg","lt","lts","ml","cc","por","en"]);
function normalizarTexto(s){
  return String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/(\d)([a-z])/g, "$1 $2").replace(/([a-z])(\d)/g, "$1 $2")
    .replace(/[^a-z0-9ñ]+/g, " ").trim();
}
function tokensDe(s){
  return normalizarTexto(s).split(" ").filter(t => t && !PALABRAS_VACIAS.has(t) && (t.length >= 2 || /\d/.test(t)));
}
function palabraCoincide(w, toks){
  if (toks.has(w)) return true;
  for (const t of toks) {
    if (/\d/.test(t)) continue;
    const corto = t.length < w.length ? t : w, largo = t.length < w.length ? w : t;
    if (corto.length >= 3 && largo.startsWith(corto)) return true; // "sec" ~ "secador", "sopapa" ~ "sopapas"
  }
  return false;
}
const SOLO_PRECIO = /^[\s$]*\d[\d.,]*\s*$/;
function claveMarca(marca){ return normalizarTexto(marca).replace(/ /g, ""); }

// ¿El archivo nombra a la marca? Es lo que separa una coincidencia real de
// una casual: en todas las listas reales el proveedor aparece nombrado
// (ROMYL, FIBRAN, LA GAUCHITA, BIOBAG…) y en ninguna coincidencia falsa.
// Marcas de 5+ letras: alcanza con que la clave aparezca pegada en el texto.
// Cortas (Pop, Make): tiene que ser una palabra suelta ("pop" ≠ "popular").
function mencionaMarca(marca, fuente){
  const clave = claveMarca(marca);
  if (clave.length >= 5 && fuente.textoNorm.includes(clave)) return true;
  if (clave.length < 5 && fuente.textoPalabras.has(clave)) return true;
  return tokensDe(marca).some(t => t.length >= 4 && fuente.textoPalabras.has(t)); // "AMERICANA" → La Americana
}

function detectarPorRenglon(marca, prods, lineasCrudas, usarNombres){
  const lineas = lineasCrudas.map(l => String(l || "").trim()).filter(Boolean);
  if (!lineas.length) return null;
  const marcaToks = new Set(tokensDe(marca));
  const clave = claveMarca(marca);
  const info = lineas.map(raw => ({
    toks: new Set(tokensDe(raw.replace(/\d[\d.,]*[.,]\d+/g, " "))), // sin precios con separador: que "1.234,50" no aporte un "50" falso
    conMarca: normalizarTexto(raw).replace(/ /g, "").includes(clave),
  }));
  const digitos = lineas.map(raw => raw.replace(/(\d)[\s-]+(?=\d)/g, "$1")); // EAN partido "7790345 101007"

  const asignados = [];
  for (const p of prods) {
    const pt = tokensDe(p.nombre).filter(t => !marcaToks.has(t));
    // Por código de barras: si nuestro código interno es un EAN y aparece en
    // un renglón, ese es el renglón — no hay forma de confundirse.
    const ean = String(p.codigo || "");
    if (/^\d{8,14}$/.test(ean)) {
      const i = digitos.findIndex(d => d.includes(ean));
      if (i >= 0) { asignados.push({ producto: p, i, pt: new Set(pt), porEan: true }); continue; }
    }
    if (!usarNombres || !pt.length) continue;
    const nums = pt.filter(t => /^\d+$/.test(t));
    const palabras = pt.filter(t => !/^\d+$/.test(t));
    let mejor = null;
    info.forEach((li, i) => {
      if (!nums.every(n => li.toks.has(n))) return;
      const hits = palabras.filter(w => palabraCoincide(w, li.toks)).length;
      // Si el renglón nombra la marca y tiene todas las medidas ("45X60
      // BIOBAG"), alcanza aunque la lista no repita "bolsa de residuo".
      const porMarca = li.conMarca && nums.length > 0;
      if (!porMarca && palabras.length && hits / palabras.length < 0.75) return;
      const score = (nums.length + hits) / pt.length + (li.conMarca ? 0.5 : 0);
      const ruido = [...li.toks].filter(t => /^\d{1,3}$/.test(t) && !nums.includes(t)).length; // otra medida en el renglón
      if (!mejor || score > mejor.score || (score === mejor.score && ruido < mejor.ruido)) mejor = { i, score, ruido };
    });
    if (mejor) asignados.push({ producto: p, i: mejor.i, pt: new Set(pt), porEan: false });
  }
  if (!asignados.length) return null;

  // Código de artículo del proveedor en cada renglón. Si varios productos ya
  // tienen código guardado, se aprende en qué posición del renglón viene
  // ("222" en "C2.014 02-0022 222 7792459002225 …", no "C2.014"); si no, el
  // primer dato del renglón que tenga números.
  const pareceCodigo = t => /^[A-Za-z0-9.\-]{1,12}$/.test(t) && /\d/.test(t) && !/^\d{8,}$/.test(t);
  const posiciones = {};
  asignados.forEach(a => {
    const cod = a.producto.codigo_proveedor && String(a.producto.codigo_proveedor).trim();
    if (!cod) return;
    const j = lineas[a.i].split(/\s+/).indexOf(cod);
    if (j >= 0) posiciones[j] = (posiciones[j] || 0) + 1;
  });
  const ranking = Object.entries(posiciones).sort((x, y) => y[1] - x[1]);
  const posAprendida = ranking.length && ranking[0][1] >= 2 ? +ranking[0][0] : null;

  const conNumeros = asignados.map(a => {
    const raw = lineas[a.i];
    const toks = raw.split(/\s+/);
    const t = posAprendida != null ? toks[posAprendida] : (toks.length > 2 ? toks[0] : null);
    // Nunca una medida del propio nombre ("45X60" en Bio Bag y en Melli
    // sería el mismo "código" para dos marcas).
    const codigo = t && pareceCodigo(t) && !tokensDe(t).some(x => a.pt.has(x)) ? t : null;
    const numsDe = (txt) => (txt.match(/\d[\d.,]*\d|\d/g) || []).filter(n => n !== codigo && !a.pt.has(n) && n.replace(/\D/g, "").length < 8);
    let nums = numsDe(raw), origen = raw, usaSiguiente = false;
    if (!nums.length && lineas[a.i + 1] && SOLO_PRECIO.test(lineas[a.i + 1])) { nums = numsDe(lineas[a.i + 1]); origen = raw + " / " + lineas[a.i + 1]; usaSiguiente = true; }
    // Código guardado distinto al del renglón encontrado por código de
    // barras → el guardado estaba mal (pasó con La Gauchita): se corrige.
    const guardado = a.producto.codigo_proveedor ? String(a.producto.codigo_proveedor).trim() : null;
    const corregirCodigo = !!(a.porEan && codigo && guardado && posAprendida != null && codigo !== guardado);
    return { ...a, codigo, nums, origen, usaSiguiente, corregirCodigo };
  });

  let mejor = null;
  for (let k = 1; k <= 3; k++) for (const formato of FORMATOS) {
    const matched = [];
    for (const a of conNumeros) {
      const s = a.nums[a.nums.length - k]; if (s == null) continue;
      const precio = parseNumero(s, formato); if (isNaN(precio)) continue;
      matched.push({ producto: a.producto, precioListaRaw: precio, nuevoPrecio: calcularPrecioFinal(marca, precio, a.producto), codigoDetectado: a.codigo, corregirCodigo: a.corregirCodigo, lineaOrigen: a.origen, via: a.porEan ? "cód. de barras" : "nombre" });
    }
    if (!matched.length) continue;
    const st = estadisticas(matched);
    if (!mejor || st.ok > mejor.st.ok || (st.ok === mejor.st.ok && st.desvio < mejor.st.desvio)) mejor = { matched, st };
  }
  if (!mejor) return null;

  const usados = new Set();
  conNumeros.forEach(a => { usados.add(a.i); if (a.usaSiguiente) usados.add(a.i + 1); });
  const noReconocidos = mejor.matched.some(m => m.via === "nombre")
    ? lineas.filter((l, i) => !usados.has(i) && /\d/.test(l) && !SOLO_PRECIO.test(l) && /[a-zñ]{3,}/i.test(l)) : [];
  return { matched: mejor.matched, metodo: mejor.matched.every(m => m.via === "cód. de barras") ? "cód. de barras" : "nombre", noReconocidos };
}

function estadisticas(matched){
  let ok = 0; const ratios = [];
  for (const m of matched) {
    if (m.nuevoPrecio != null && !precioSospechoso(m.nuevoPrecio, m.producto.mayorista)) {
      ok++;
      if (m.producto.mayorista > 0) ratios.push(m.nuevoPrecio / m.producto.mayorista);
    }
  }
  return { ok, total: matched.length, desvio: desvioMediano(ratios) };
}

// ¿Este resultado es de verdad de esta marca? Que una lista de un proveedor
// nunca actualice artículos de otro (la de Romyl trae "SOPAPA NEGRA", que no
// puede pisar la Sopapa de Fedata; los códigos chicos 1, 2, 3… se repiten
// entre proveedores). Calibrado cruzando cada lista real contra cada marca.
function aceptable(det, fuente, mencionada){
  const st = estadisticas(det.matched);
  if (!st.total || st.ok / st.total < 0.8) return false;         // la gran mayoría tiene que dar un precio creíble
  if (det.metodo === "cód. de barras") return true;              // un EAN no se confunde
  if (!mencionada) return false;                                 // por código o nombre: el archivo tiene que nombrar la marca
  return st.desvio === Infinity || st.desvio <= 0.6;             // y los precios no pueden quedar corridos al azar
}

// ── 4. Por posición en la página (catálogos en grilla, p.ej. MisPlast) ──
// Cada producto es una "tarjeta": arriba "CODIGO DE ART: 2008", abajo
// "P.UNITARIO: $ 5.942,00". Se busca el rótulo con el código del artículo y
// se toma el primer precio que está debajo, en la misma columna.
// El código sale de codigo_proveedor o, si no hay, del código interno
// ("MISPLAST-2008" → "2008").
function codigoArticuloDe(p){
  if (p.codigo_proveedor) return String(p.codigo_proveedor).trim();
  const m = String(p.codigo || "").match(/^[A-Za-z]+-([A-Za-z0-9]{3,8})$/);
  return m ? m[1] : null;
}
function detectarPorPosicion(marca, prods, items){
  if (!items || !items.length) return null;
  // Tarjetas: rótulo "CODIGO DE ART:" + el código (en el mismo texto o en el
  // de al lado, en la misma altura).
  const rotulos = items.filter(i => /c[oó]d(igo)?\.?\s*(de\s*)?art/i.test(i.s) && !/barra/i.test(i.s));
  const tarjetas = [];
  for (const r of rotulos) {
    let cod = (r.s.match(/art[^:]*:\s*([A-Za-z0-9]{3,8})\b/i) || [])[1];
    if (!cod) {
      const vecino = items.filter(i => i.p === r.p && Math.abs(i.y - r.y) <= 4 && i.x > r.x && i.x - r.x <= 220 && /^[A-Za-z0-9]{3,8}$/.test(i.s))
        .sort((a, b) => a.x - b.x)[0];
      cod = vecino && vecino.s;
    }
    if (cod) tarjetas.push({ cod, p: r.p, x: r.x, y: r.y, s: r.s });
  }
  const precios = items.filter(i => /\$\s*\d/.test(i.s)).map(i => ({ ...i, num: i.s.match(/\$\s*(\d[\d.,]*\d|\d)/)[1] }));
  if (!tarjetas.length || !precios.length) return null;
  // Precio de cada tarjeta: el primero debajo, dentro del ancho de la
  // tarjeta, y antes de llegar a la tarjeta siguiente de la misma columna.
  const precioDe = (t) => {
    const siguiente = tarjetas.filter(o => o !== t && o.p === t.p && o.y < t.y - 4 && Math.abs(o.x - t.x) < 80).sort((a, b) => b.y - a.y)[0];
    const piso = siguiente ? siguiente.y : -Infinity;
    return precios.filter(pr => pr.p === t.p && pr.y < t.y && pr.y > piso && t.y - pr.y < 340 && pr.x >= t.x - 40 && pr.x <= t.x + 280)
      .sort((a, b) => b.y - a.y)[0] || null;
  };
  const porCod = new Map(tarjetas.map(t => [t.cod, t]));
  const encontrados = [];
  for (const p of prods) {
    const cod = codigoArticuloDe(p);
    const t = cod && porCod.get(cod);
    if (!t) continue;
    const pr = precioDe(t);
    if (pr) encontrados.push({ producto: p, cod, num: pr.num, origen: `art. ${cod} … ${pr.s}` });
  }
  if (!encontrados.length) return null;
  let mejor = null;
  for (const formato of FORMATOS) {
    const matched = encontrados.map(e => {
      const precio = parseNumero(e.num, formato);
      return { producto: e.producto, precioListaRaw: precio, nuevoPrecio: isNaN(precio) ? null : calcularPrecioFinal(marca, precio, e.producto), codigoDetectado: e.producto.codigo_proveedor ? null : e.cod, lineaOrigen: e.origen, via: "posición en la página" };
    });
    const st = estadisticas(matched);
    if (!mejor || st.ok > mejor.st.ok || (st.ok === mejor.st.ok && st.desvio < mejor.st.desvio)) mejor = { matched, st };
  }
  return { matched: mejor.matched, metodo: "posición" };
}

function palabrasDeFuente(fuente){
  return fuente.lineas.map(l => String(l || "").trim().split(/\s+/).filter(s => /[A-Za-z0-9]/.test(s))).filter(f => f.length);
}

function detectarMarca(marca, fuente, forzada){
  const r = reglaDe(marca);
  if (!r || r.estado !== "Definida") return null;
  const prods = CATALOGO.filter(p => p.marca === marca);
  if (!prods.length) return null;
  const mencionada = forzada || mencionaMarca(marca, fuente);

  // Texto copiado de un PDF: espacios dobles sueltos pueden juntar código y
  // nombre en una celda — segundo intento con cada palabra en su columna.
  let porCod = detectarPorCodigo(marca, prods, fuente.filas) || detectarPorCodigo(marca, prods, palabrasDeFuente(fuente));
  if (porCod && !aceptable(porCod, fuente, mencionada)) porCod = null;
  const conCod = prods.filter(p => p.codigo_proveedor).length;
  let porRen = detectarPorRenglon(marca, prods, fuente.lineas, mencionada && conCod < prods.length / 2);
  if (porRen && !aceptable(porRen, fuente, mencionada)) porRen = null;
  let porPos = detectarPorPosicion(marca, prods, fuente.items);
  if (porPos && !aceptable(porPos, fuente, mencionada)) porPos = null;
  if (!porCod && !porRen && !porPos) return null;

  // Combinar: lo encontrado por código de barras manda (la identidad es
  // segura), salvo que dé un precio absurdo y el código de proveedor no.
  // Lo de "posición" solo completa lo que no salió por los otros dos.
  const items = new Map();
  (porPos ? porPos.matched : []).forEach(m => items.set(m.producto.codigo, m));
  (porCod ? porCod.matched : []).forEach(m => items.set(m.producto.codigo, m));
  (porRen ? porRen.matched : []).forEach(m => {
    const previo = items.get(m.producto.codigo);
    const eanRaro = precioSospechoso(m.nuevoPrecio, m.producto.mayorista);
    const previoOk = previo && !precioSospechoso(previo.nuevoPrecio, previo.producto.mayorista);
    if (!previo || (m.via === "cód. de barras" && !(eanRaro && previoOk))) items.set(m.producto.codigo, m);
  });
  const metodos = [porCod && porCod.metodo, porRen && porRen.metodo, porPos && porPos.metodo].filter(Boolean);
  return { matched: [...items.values()], metodo: metodos.join(" + "), noReconocidos: porRen ? porRen.noReconocidos : [] };
}

// Recorre todas las fuentes × todas las marcas con regla y arma el resultado
// combinado: por artículo, el precio más barato entre las listas donde aparece.
// `forzar` = { nombreDeFuente: marca } cuando Pablo eligió a mano de qué
// proveedor es una lista que no se pudo reconocer sola (p.ej. un mensaje que
// no nombra al proveedor).
function analizarFuentes(fuentes, forzar){
  fuentes.forEach(f => {
    const norm = normalizarTexto(f.lineas.join(" "));
    f.textoNorm = norm.replace(/ /g, "");
    f.textoPalabras = new Set(norm.split(" "));
  });
  const marcas = [...new Set(CATALOGO.map(p => p.marca))];
  const porMarca = {};
  const noReconocidas = [];
  for (const f of fuentes) {
    let algo = false;
    const forzada = forzar && forzar[f.nombre];
    for (const marca of (forzada ? [forzada] : marcas)) {
      const det = detectarMarca(marca, f, !!forzada);
      if (!det) continue;
      algo = true;
      const g = porMarca[marca] || (porMarca[marca] = { marca, items: new Map(), fuentes: [], metodos: new Set(), noReconocidos: [] });
      g.fuentes.push(f.nombre); g.metodos.add(det.metodo);
      (det.noReconocidos || []).forEach(l => g.noReconocidos.push(l));
      for (const m of det.matched) {
        const previo = g.items.get(m.producto.codigo);
        if (!previo || (m.nuevoPrecio != null && (previo.nuevoPrecio == null || m.nuevoPrecio < previo.nuevoPrecio))) {
          g.items.set(m.producto.codigo, { ...m, fuente: f.nombre });
        }
      }
    }
    if (!algo) noReconocidas.push(f.nombre);
  }
  return { grupos: Object.values(porMarca), noReconocidas };
}

// ── Flujo ──
async function procesarFuentes(fuentes){
  $("importOrigen").style.display = "none";
  $("importPreview").style.display = "none";
  $("importProgreso").style.display = "";
  $("importProgreso").textContent = "Analizando la lista…";
  await new Promise(r => setTimeout(r, 30));
  importState.fuentes = fuentes;
  importState.resultado = analizarFuentes(fuentes);
  $("importProgreso").style.display = "none";
  renderImportPreview();
}

$("importFile").addEventListener("change", async (e) => {
  const files = [...e.target.files]; if (!files.length) return;
  $("importOrigen").style.display = "none";
  $("importProgreso").style.display = "";
  try {
    const fuentes = [];
    for (const file of files) {
      $("importProgreso").textContent = `Leyendo ${file.name}…`;
      fuentes.push(await leerArchivo(file));
    }
    await procesarFuentes(fuentes);
  } catch (err) {
    $("importProgreso").style.display = "none";
    $("importOrigen").style.display = "";
    toast("No se pudo leer el archivo: " + err.message);
  }
});

$("btnAnalizarTexto").onclick = () => {
  const texto = $("importTexto").value;
  if (!texto.trim()) { toast("Pegá el texto primero"); return; }
  procesarFuentes([fuenteDeTexto("texto pegado", texto)]);
};

$("btnImportOtra").onclick = () => resetImportPanel();

$("importGrupos").addEventListener("change", (e) => {
  const sel = e.target.closest(".import-forzar");
  if (!sel || !sel.value) return;
  importState.forzar = { ...(importState.forzar || {}), [sel.dataset.fuente]: sel.value };
  importState.resultado = analizarFuentes(importState.fuentes, importState.forzar);
  renderImportPreview();
});

function renderImportPreview(){
  const { grupos, noReconocidas } = importState.resultado;
  const aplicar = [];
  let soloCodigos = 0;
  let html = "";
  let totalIguales = 0;
  for (const g of grupos) {
    const items = [...g.items.values()];
    const cambian = items.filter(m => m.nuevoPrecio != null && m.nuevoPrecio !== m.producto.mayorista);
    const ok = cambian.filter(m => !precioSospechoso(m.nuevoPrecio, m.producto.mayorista));
    // Sin precio en la lista (sin stock / renglón sin importe): no es un
    // error, simplemente no hay precio nuevo — quedan como están.
    const sinPrecio = cambian.filter(m => precioSospechoso(m.nuevoPrecio, m.producto.mayorista) && (/sin\s*stock/i.test(m.lineaOrigen || "") || !(m.nuevoPrecio >= 20)));
    const raros = cambian.filter(m => precioSospechoso(m.nuevoPrecio, m.producto.mayorista) && !sinPrecio.includes(m));
    const iguales = items.length - cambian.length;
    totalIguales += iguales;
    ok.forEach(m => aplicar.push(m));
    // Mismo precio pero con código de proveedor para guardar/corregir: se
    // guarda igual (sin contarlo como cambio de precio).
    items.filter(m => !cambian.includes(m) && m.codigoDetectado && (!m.producto.codigo_proveedor || m.corregirCodigo) && !precioSospechoso(m.nuevoPrecio, m.producto.mayorista))
      .forEach(m => { soloCodigos++; aplicar.push(m); });
    const prods = CATALOGO.filter(p => p.marca === g.marca);
    const faltan = prods.filter(p => !g.items.has(p.codigo));
    const fila = (m, raro) => `
      <tr${raro ? ' style="background:var(--danger-dim)"' : ''}>
        <td>${escHtml(m.producto.nombre)}<div style="font-size:9.5px; color:var(--text-muted); margin-top:2px">${escHtml(m.via || "")}${m.lineaOrigen ? " · “" + escHtml(m.lineaOrigen.slice(0, 60)) + "”" : ""}${g.fuentes.length > 1 ? " · " + escHtml(m.fuente) : ""}</div></td>
        <td>${fmt(m.producto.mayorista)}</td>
        <td class="flecha">→</td>
        <td class="${raro ? '' : 'nuevo'}" style="${raro ? 'color:var(--danger); font-weight:800' : ''}">$${fmt(m.nuevoPrecio)}${raro ? ' ⚠️' : ''}</td>
      </tr>`;
    html += `
      <div class="import-grupo">
        <div class="import-grupo-head"><b>${escHtml(g.marca)}</b> · ${items.length} de ${prods.length} artículos reconocidos · <b>${ok.length}</b> cambian${iguales ? ` · ${iguales} iguales` : ""}</div>
        ${raros.length ? `<div class="import-grupo-nota" style="color:#B45400">⚠️ ${raros.length} con un precio muy distinto al actual — marcados en rojo, NO se tocan.</div>` : ""}
        ${sinPrecio.length ? `<div class="import-grupo-nota">Sin precio en la lista (sin stock), quedan como están: ${sinPrecio.map(m => escHtml(m.producto.nombre)).join(", ")}</div>` : ""}
        ${faltan.length ? `<div class="import-grupo-nota">No están en la lista: ${faltan.map(p => escHtml(p.nombre)).join(", ")}</div>` : ""}
        ${g.noReconocidos.length ? `<div class="import-grupo-nota">En la lista pero no en el catálogo: ${g.noReconocidos.slice(0, 8).map(escHtml).join(", ")}</div>` : ""}
        ${ok.length || raros.length ? `<div class="import-preview-wrap"><table class="import-preview-tabla">
          <thead><tr><th>Producto</th><th>Actual</th><th></th><th>Nuevo</th></tr></thead>
          <tbody>${ok.map(m => fila(m, false)).join("")}${raros.map(m => fila(m, true)).join("")}</tbody>
        </table></div>` : ""}
      </div>`;
  }
  if (noReconocidas.length) {
    // Nunca un callejón sin salida: si una lista no se reconoce sola (p.ej.
    // un mensaje que no nombra al proveedor), se elige la marca con un toque.
    const opciones = [...new Set(CATALOGO.map(p => p.marca))].filter(m => { const r = reglaDe(m); return r && r.estado === "Definida"; }).sort();
    html += noReconocidas.map(n => `
      <div class="import-grupo" style="background:var(--danger-dim); border-radius:12px; padding:10px 12px">
        <div class="import-grupo-head">No reconocí solo de qué proveedor es <b>${escHtml(n)}</b>. ¿De cuál es?</div>
        <select class="import-forzar" data-fuente="${escHtml(n)}" style="width:100%; padding:10px; border-radius:10px; border:none; background:var(--bg-card); font-size:14px">
          <option value="">Elegí el proveedor…</option>
          ${opciones.map(m => `<option value="${escHtml(m)}">${escHtml(m)}</option>`).join("")}
        </select>
      </div>`).join("");
  }
  const marcasTxt = grupos.map(g => g.marca).join(", ");
  $("importResumen").innerHTML = grupos.length
    ? `Detecté: <b>${escHtml(marcasTxt)}</b>${importState.fuentes.length > 1 ? ` (${importState.fuentes.length} listas — si un artículo está en varias, queda el más barato)` : ""}`
    : "No reconocí ningún artículo del catálogo en esta lista.";
  $("importGrupos").innerHTML = html;
  importState.aplicar = aplicar;
  const nPrecios = aplicar.length - soloCodigos;
  $("btnImportAplicar").textContent = nPrecios
    ? `Aplicar ${nPrecios} precio${nPrecios === 1 ? "" : "s"} nuevo${nPrecios === 1 ? "" : "s"}`
    : (soloCodigos ? `Guardar ${soloCodigos} código${soloCodigos === 1 ? "" : "s"} de proveedor (precios al día)` : (grupos.length ? "Todo al día — no hay cambios" : "Nada para aplicar"));
  $("btnImportAplicar").disabled = !aplicar.length;
  $("importPreview").style.display = "";
}

$("btnImportAplicar").onclick = async () => {
  const lista = importState.aplicar || [];
  if (!lista.length) return;
  $("btnImportAplicar").disabled = true;
  let ok = 0, fail = 0;
  const CHUNK = 10;
  for (let i = 0; i < lista.length; i += CHUNK) {
    await Promise.all(lista.slice(i, i + CHUNK).map(async ({ producto, nuevoPrecio, codigoDetectado, corregirCodigo }) => {
      // Si el renglón traía el código de artículo del proveedor y no lo
      // teníamos (o el guardado estaba mal según el código de barras), se
      // guarda: la próxima lista de esa marca va directo y bien por código.
      const body = { mayorista: nuevoPrecio };
      if (codigoDetectado && (!producto.codigo_proveedor || corregirCodigo)) body.codigo_proveedor = codigoDetectado;
      try {
        const res = await fetch(`${SB_URL}/rest/v1/catalogo_visual_productos?codigo=eq.${encodeURIComponent(producto.codigo)}`, {
          method: "PATCH",
          headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}`, "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error();
        producto.mayorista = nuevoPrecio;
        if (body.codigo_proveedor) producto.codigo_proveedor = body.codigo_proveedor;
        ok++;
      } catch (e) { fail++; }
    }));
    $("btnImportAplicar").textContent = `Guardando… ${Math.min(i + CHUNK, lista.length)} / ${lista.length}`;
  }
  toast(`✔ ${ok} precio${ok === 1 ? "" : "s"} actualizado${ok === 1 ? "" : "s"}${fail ? `, ${fail} con error` : ""}`);
  renderMarcas();
  if (fail) { renderImportPreview(); return; }
  resetImportPanel();
  setModo("precio");
};

// ══════════════════ SECCIÓN REGLAS ══════════════════
const BASE_TIPOS = [
  ["", "— elegir —"],
  ["PRECIO_FINAL_CON_IMPUESTOS", "Precio final (ya incluye impuestos)"],
  ["PRECIO_CON_IVA", "Precio con IVA (no es el final)"],
  ["COSTO_NETO_REAL", "Costo neto real"],
  ["PRECIO_LISTA_COSTO", "Precio de lista = costo, tal cual"],
  ["LISTA_MAS_IVA", "Al precio de lista hay que sumarle IVA"],
  ["BULTO_DIV_UNIDADES", "Precio de un bulto ÷ unidades del bulto"],
];
const ESTADOS = ["Definida", "Falta definir", "Sistema propio"];

function renderReglasSeccion(){
  if (!REGLAS.length) {
    $("reglasLista").innerHTML = `<div class="empty">Todavía no existe la tabla de reglas.<br><small>Corré el SQL de creación en Supabase y volvé a entrar.</small></div>`;
    return;
  }
  const conteoMarca = {};
  CATALOGO.forEach(p => { conteoMarca[p.marca] = (conteoMarca[p.marca]||0)+1; });
  const conPrecio = {};
  CATALOGO.forEach(p => { if (p.mayorista != null) conPrecio[p.marca] = (conPrecio[p.marca]||0)+1; });

  $("reglasLista").innerHTML = REGLAS.map(r => {
    const total = conteoMarca[r.marca] || 0;
    const conP = conPrecio[r.marca] || 0;
    return `
    <div class="regla-card" data-marca="${escHtml(r.marca)}">
      <div class="regla-head">
        <div class="regla-marca">${escHtml(r.marca)}</div>
        <div class="regla-estado ${r.estado.replace(/\s/g,'.')}">${escHtml(r.estado)}</div>
      </div>
      ${r.estado === "Definida" ? `
      <div class="regla-grid">
        <div class="regla-field">
          <label>Base de cálculo</label>
          <select class="f-base_tipo">${BASE_TIPOS.map(([v,l]) => `<option value="${v}" ${v===r.base_tipo?'selected':''}>${l}</option>`).join("")}</select>
        </div>
        <div class="regla-field">
          <label>IVA a sumar (%)</label>
          <input type="number" class="f-iva_pct" step="0.1" min="0" value="${r.iva_pct ?? ''}" placeholder="—" />
        </div>
        <div class="regla-field">
          <label>Multiplicador general</label>
          <input type="number" class="f-multiplicador" step="0.01" min="0" value="${r.multiplicador ?? ''}" />
        </div>
        <div class="regla-field">
          <label>Multiplicador excepción</label>
          <input type="number" class="f-multiplicador_excepcion" step="0.01" min="0" value="${r.multiplicador_excepcion ?? ''}" placeholder="—" />
        </div>
      </div>
      <div class="regla-formula">${escHtml(r.formula_texto || "")}</div>
      ` : ""}
      <textarea class="regla-notas f-notas" placeholder="Notas...">${escHtml(r.notas || "")}</textarea>
      <div class="regla-count">${conP}/${total} productos con precio cargado</div>
    </div>`;
  }).join("");
}

let guardarReglaTimeout = {};
$("reglasLista").addEventListener("change", (e) => guardarCampoRegla(e.target));
$("reglasLista").addEventListener("focusout", (e) => { if (e.target.classList.contains("f-notas")) guardarCampoRegla(e.target); });

function guardarCampoRegla(target){
  const campo = [...target.classList].find(c => c.startsWith("f-"));
  if (!campo) return;
  const card = target.closest(".regla-card");
  const marca = card.dataset.marca;
  const r = reglaDe(marca);
  const key = campo.slice(2);
  let val = target.value === "" ? null : target.value;
  if (["iva_pct","multiplicador","multiplicador_excepcion"].includes(key) && val != null) val = Number(val);
  r[key] = val;

  clearTimeout(guardarReglaTimeout[marca]);
  guardarReglaTimeout[marca] = setTimeout(async () => {
    const body = {}; body[key] = val;
    const res = await fetch(`${SB_URL}/rest/v1/reglas_precio_proveedor?marca=eq.${encodeURIComponent(marca)}`, {
      method: "PATCH",
      headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}`, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify(body),
    });
    toast(res.ok ? `✔ Regla de ${marca} actualizada` : "Error al guardar la regla");
  }, 400);
}

// ── Tabs de sección ──
document.querySelectorAll(".section-tab").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".section-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const sec = btn.dataset.sec;
    $("secPrecios").style.display = sec === "precios" ? "" : "none";
    $("secReglas").style.display = sec === "reglas" ? "" : "none";
  };
});

init();

// ══════════════════ PWA: service worker con auto-update silencioso ══════════════════
// Cachea solo el shell estático (este HTML + manifest + icons) — nunca las
// respuestas de Supabase, que siempre tienen que ser en vivo. Si al abrir la
// app hay una versión nueva de sw.js, se instala y activa sola (skipWaiting
// en sw.js) y acá recargamos una vez apenas toma el control — sin que haya
// que tocar ningún botón.
if ("serviceWorker" in navigator && !navigator.userAgent.includes("Electron")) {
  // La ventana de escritorio no necesita nada de esto (siempre carga la
  // URL en vivo, no se "instala" en ningún lado) y, de paso, en esta
  // versión de Electron el Service Worker + Cache Storage hace que el
  // renderer se caiga solo unos segundos después de cargar (bug de
  // Electron con blink.mojom.CacheStorage). Se salta directamente ahí.
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
  let recargando = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (recargando) return;
    recargando = true;
    toast("Actualizando…");
    setTimeout(() => location.reload(), 400);
  });
}
